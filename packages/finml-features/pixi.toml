# ==================================================================================================
# packages/finml-features/pixi.toml
# ==================================================================================================

[package]
name = "finml-features"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }

[package.host-dependencies]
python = ">=3.14.8,<3.15"
hatchling = ">=1.33.0,<2"

[package.run-dependencies]
pandas = ">=3.0.6,<4"
numpy = ">=2.5.4,<3"
ta-lib = ">=0.8.2,<0.9"

# ==================================================================================================
