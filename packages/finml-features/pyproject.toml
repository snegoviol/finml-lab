# ==================================================================================================
# packages/finml-features/pyproject.toml
# ==================================================================================================

[project]
name = "finml-features"
version = "0.1.0"
description = """
A lightweight, standalone module designed to effortlessly generate 
model-ready inputs by abstracting complex data transformations, enabling 
quick interaction with models trained in the Financial Machine Learning 
Laboratory without manual pipeline recreation.
"""

license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Homepage = "https://github.com/snegoviol/finml-lab"
Documentation = "https://github.com/snegoviol/finml-lab#readme"
Repository = "https://github.com/snegoviol/finml-lab/tree/main/packages/src/finml-features"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/finml_features/"]

# ==================================================================================================
