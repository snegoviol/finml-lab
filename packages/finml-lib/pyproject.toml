# ==================================================================================================
# packages/finml-lib/pyproject.toml
# ==================================================================================================

[project]
name = "finml-lib"
version = "0.1.0"
description = """
Reusable modules extracted from Jupyter notebooks to keep notebooks focused on 
exploration and prototyping, while moving bulky utility code into an importable package
for the Financial Machine Learning Laboratory.
"""

license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Homepage = "https://github.com/snegoviol/finml-lab"
Documentation = "https://github.com/snegoviol/finml-lab#readme"
Repository = "https://github.com/snegoviol/finml-lab/tree/main/packages/finml-lib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/finml_lib/"]

# ==================================================================================================
