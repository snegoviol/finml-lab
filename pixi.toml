# ==================================================================================================
# pixi.toml
# ==================================================================================================

[workspace]
authors = ["Ilya Snegov <unweariedheart@gmail.com>"]
name = "finml-lab"
version = "0.1.0"
license = "Apache-2.0 AND CC0-1.0"
repository = "https://github.com/snegoviol/finml-lab"

channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.84.1"

# ==================================================================================================

[dependencies]
python = ">=3.14.8,<3.15"
jupyterlab = ">=4.6.4,<5"
pandas = ">=3.0.6,<4"
numpy = ">=2.5.4,<3"
jaxtyping = ">=0.3.11,<0.4"
kagglehub = ">=1.0.2,<2"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
pyarrow = ">=25.0.0,<26"
ta-lib = ">=0.8.2,<0.9"
statsmodels = ">=0.15.0,<0.16"
scipy = ">=1.18.1,<2"
xgboost = ">=3.4.2,<4"
optuna = ">=5.0.0,<6"
ipywidgets = ">=8.1.9,<9"
tqdm = ">=4.70.1,<5"
plotly = ">=7.1.0,<8"
finml-lib = { path = "./packages/finml-lib" }
finml-features = { path = "./packages/finml-features" }

[pypi-dependencies]
rustuna = ">=0.2.1,<0.3"

# ==================================================================================================
